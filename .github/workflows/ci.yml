name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eve_diagnostics
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve -d eve_diagnostics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eve:eve@localhost:5432/eve_diagnostics
      # >= 32 bytes: it is also the JWT HMAC key (RFC 7518 §3.2); PyJWT warns below that.
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests against PostgreSQL
        run: pytest --cov --cov-report=term-missing

      - name: Build the OpenAPI schema
        run: python manage.py spectacular --fail-on-warn --file /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t eve-diagnostics:ci .
