{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FBF7F1">
  <title>EVE Diagnostics</title>
  <meta name="description" content="Book diagnostic tests at EVE partner centres and pay in a minute.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='13' r='9' fill='%23FF6B57'/%3E%3Cpath d='M14 30a10 10 0 0 1 16-8H14z' fill='%231A9E8F'/%3E%3Crect x='17' y='3' width='11' height='11' rx='3' fill='%23FFB23F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'app/styles.css' %}">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="ring"></span>
    <span class="dots"></span>
  </div>

  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar" id="topbar" hidden></header>
  <main id="view" class="view" tabindex="-1">
    <div class="boot"><span class="spinner" aria-label="Loading"></span></div>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This app needs JavaScript. The API itself is documented at <a href="/api/docs/">/api/docs/</a>.</p></noscript>
  <script type="module" src="{% static 'app/app.js' %}"></script>
</body>
</html>
