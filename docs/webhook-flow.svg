<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 0 960 362" role="img" aria-labelledby="title desc">
  <title id="title">Idempotent webhook flow</title>
  <desc id="desc">The payment provider sends a signed event that it may send again. The API verifies the signature and rejects bad ones with 401, then stores the event under a unique event ID before processing. A new event is applied once by the worker and updates the booking; a duplicate is rejected by the database, counted, and changes nothing.</desc>
  <defs>
    <style>
      .h { font: 700 22px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #1C1A2E; }
      .sub { font: 400 13.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #6B6880; }
      .t { font: 700 15px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #1C1A2E; }
      .s { font: 400 12.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #6B6880; }
      .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4A4760; }
      .num { font: 700 12px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .edge { fill: none; stroke: #8A8599; stroke-width: 1.6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A8599" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1C1A2E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="361" rx="18" fill="#FBF7F1" stroke="#E9E3D8"/>
  <text class="h" x="40" y="50">Idempotent webhook flow</text>
  <text class="sub" x="40" y="74">Providers resend events. A unique event ID in the database means each event is applied once, however many times it arrives.</text>

  <!-- pipeline -->
  <g filter="url(#shadow)">
    <rect x="40" y="126" width="210" height="104" rx="12" fill="#FFFFFF" stroke="#E2DACC"/>
    <rect x="290" y="126" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#CFC6F7"/>
    <rect x="530" y="126" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#CFC6F7"/>
  </g>

  <circle cx="68" cy="156" r="14" fill="#FFE6E1"/>
  <rect x="59" y="150" width="18" height="12" rx="2" fill="none" stroke="#A8321F" stroke-width="1.4"/>
  <line x1="59" y1="154.5" x2="77" y2="154.5" stroke="#A8321F" stroke-width="1.4"/>
  <text class="t" x="90" y="161">Payment provider</text>
  <text class="m" x="60" y="192">evt_123 · signed</text>
  <text class="s" x="60" y="212">May send it again</text>

  <circle cx="318" cy="156" r="13" fill="#3B2DA6"/>
  <text class="num" x="318" y="160.5" text-anchor="middle">1</text>
  <text class="t" x="340" y="161">Verify signature</text>
  <text class="m" x="310" y="192">HMAC-SHA256</text>
  <text class="s" x="310" y="212">5-minute time window</text>

  <circle cx="558" cy="156" r="13" fill="#3B2DA6"/>
  <text class="num" x="558" y="160.5" text-anchor="middle">2</text>
  <text class="t" x="580" y="161">Store the event</text>
  <text class="m" x="550" y="192">event_id UNIQUE</text>
  <text class="s" x="550" y="212">Saved before processing</text>

  <!-- branches -->
  <g filter="url(#shadow)">
    <rect x="770" y="88" width="160" height="88" rx="12" fill="#EAF7F4" stroke="#9ED8CC"/>
    <rect x="770" y="214" width="160" height="88" rx="12" fill="#F4F1EC" stroke="#DCD3C5"/>
  </g>
  <circle cx="794" cy="117" r="12" fill="#1A9E8F"/>
  <path d="M788.5 117 L792.5 121 L799.5 113" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="814" y="122" style="fill:#0D6B61">New event</text>
  <text class="s" x="786" y="148">Applied once</text>
  <text class="s" x="786" y="165">Booking updated</text>

  <circle cx="794" cy="243" r="12" fill="#A8A2B6"/>
  <rect x="788" y="238" width="9" height="9" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <rect x="791" y="241" width="9" height="9" rx="1.5" fill="#A8A2B6" stroke="#FFFFFF" stroke-width="1.6"/>
  <text class="t" x="814" y="248" style="fill:#57536A">Duplicate</text>
  <text class="s" x="786" y="274">DB rejects the insert</text>
  <text class="s" x="786" y="291">Counted, no change</text>

  <!-- reject path -->
  <line class="edge" x1="390" y1="230" x2="390" y2="261" marker-end="url(#arrow)"/>
  <rect x="300" y="264" width="180" height="30" rx="15" fill="#FFE6E1" stroke="#F5C2B9"/>
  <text class="s" x="390" y="283.5" text-anchor="middle" style="fill:#A8321F;font-weight:700">Bad signature → 401</text>

  <!-- edges -->
  <line class="edge" x1="250" y1="178" x2="287" y2="178" marker-end="url(#arrow)"/>
  <line class="edge" x1="490" y1="178" x2="527" y2="178" marker-end="url(#arrow)"/>
  <path class="edge" d="M730 160 C752 160 748 132 767 132" marker-end="url(#arrow)"/>
  <path class="edge" d="M730 196 C752 196 748 258 767 258" marker-end="url(#arrow)"/>

  <text class="s" x="40" y="336">Two copies arriving at the same instant: the database lets exactly one insert win, and the other is treated as a duplicate.</text>
</svg>
