<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Booking and payment flow</title>
  <desc id="desc">A patient compares prices, books a slot, which creates a pending booking with the price saved, then pays. Paying locks the booking row. An approved payment confirms the booking; a declined one marks it failed, and the patient can retry with a new idempotency key.</desc>
  <defs>
    <style>
      .h { font: 700 22px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #1C1A2E; }
      .sub { font: 400 13.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #6B6880; }
      .t { font: 700 15px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #1C1A2E; }
      .s { font: 400 12.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #6B6880; }
      .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4A4760; }
      .num { font: 700 12px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .edge { fill: none; stroke: #8A8599; stroke-width: 1.6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8A8599" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1C1A2E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="349" rx="18" fill="#FBF7F1" stroke="#E9E3D8"/>
  <text class="h" x="40" y="50">Booking and payment flow</text>
  <text class="sub" x="40" y="74">The price is saved on the booking, and the booking row is locked while paying, so it can never be charged twice.</text>

  <!-- steps -->
  <g filter="url(#shadow)">
    <rect x="40" y="118" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#E2DACC"/>
    <rect x="280" y="118" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#E2DACC"/>
    <rect x="520" y="118" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#E2DACC"/>
  </g>

  <circle cx="68" cy="148" r="13" fill="#1C1A2E"/>
  <text class="num" x="68" y="152.5" text-anchor="middle">1</text>
  <text class="t" x="90" y="153">Compare prices</text>
  <text class="m" x="60" y="184">GET /offerings/</text>
  <text class="s" x="60" y="204">Cheapest centre first</text>

  <circle cx="308" cy="148" r="13" fill="#1C1A2E"/>
  <text class="num" x="308" y="152.5" text-anchor="middle">2</text>
  <text class="t" x="330" y="153">Book a slot</text>
  <text class="m" x="300" y="184">POST /bookings/</text>
  <text class="s" x="300" y="204">PENDING · price saved</text>

  <circle cx="548" cy="148" r="13" fill="#1C1A2E"/>
  <text class="num" x="548" y="152.5" text-anchor="middle">3</text>
  <text class="t" x="570" y="153">Pay</text>
  <text class="m" x="540" y="184">POST /payments/</text>
  <text class="s" x="540" y="204">Booking row locked</text>

  <!-- outcomes -->
  <g filter="url(#shadow)">
    <rect x="760" y="86" width="170" height="80" rx="12" fill="#EAF7F4" stroke="#9ED8CC"/>
    <rect x="760" y="206" width="170" height="80" rx="12" fill="#FFF1EC" stroke="#F5C2B9"/>
  </g>
  <circle cx="784" cy="117" r="12" fill="#1A9E8F"/>
  <path d="M778.5 117 L782.5 121 L789.5 113" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="804" y="122" style="fill:#0D6B61">Approved</text>
  <text class="s" x="778" y="148">Booking CONFIRMED</text>

  <circle cx="784" cy="237" r="12" fill="#FF6B57"/>
  <path d="M779.5 232.5 L788.5 241.5 M788.5 232.5 L779.5 241.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text class="t" x="804" y="242" style="fill:#A8321F">Declined</text>
  <text class="s" x="778" y="268">Booking FAILED</text>

  <!-- edges -->
  <line class="edge" x1="240" y1="170" x2="277" y2="170" marker-end="url(#arrow)"/>
  <line class="edge" x1="480" y1="170" x2="517" y2="170" marker-end="url(#arrow)"/>
  <path class="edge" d="M720 150 C742 150 738 126 757 126" marker-end="url(#arrow)"/>
  <path class="edge" d="M720 190 C742 190 738 246 757 246" marker-end="url(#arrow)"/>
  <path class="edge" d="M845 286 V312 H620 V225" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <rect x="662" y="301" width="140" height="22" rx="11" fill="#FBF7F1" stroke="#E2DACC"/>
  <text class="s" x="732" y="316" text-anchor="middle">Retry with a new key</text>
</svg>
